lique nos títulos das colunas para ordenar. Itens marcados como &quot;Não coletar&quot; no Gerenciar loot aparecem como não coletados e ficam fora do valor/h.</p>\n</div><div class=\"card\">\n  <h4><button class=\"ghost inline\" data-tab=\"bestiary\">Bestiário →</button></h4>\n  <p>Quantas kills você tem de cada criatura, quanto falta para completar e em quanto tempo.</p>\n  <p class=\"dim\">O tempo usa o ritmo da medição ao vivo ou o da última medição salva da hunt.</p>\n</div><div class=\"card\">\n  <h4><button class=\"ghost inline\" data-tab=\"codex\">Codex →</button></h4>\n  <p>Horas até cada etapa do Codex de domínio da hunt, e o que falta em bosses e equipamento.</p>\n  <p class=\"dim\">As linhas em destaque pedem um item que a hunt escolhida dropa. A etapa mais lenta define o tempo.</p>\n</div><div class=\"card\">\n  <h4><button class=\"ghost inline\" data-tab=\"charms\">Charms →</button></h4>\n  <p>O melhor major e minor por criatura, com o ganho de cada um, Gut e Scavenge pelo loot e o dano recebido para Parry e Dodge.</p>\n  <p class=\"dim\">Precisa da party e dos charms lidos e de 2 min de medição. Use &quot;Otimizar Lucro/h&quot; ou &quot;Otimizar XP/h&quot; conforme o seu objetivo.</p>\n</div><div class=\"card\">\n  <h4><button class=\"ghost inline\" data-tab=\"sample\">Amostra →</button></h4>\n  <p>Chance e quantidade de cada drop medidas kill a kill, comparadas com a tabela do jogo.</p>\n  <p class=\"dim\">Cresce sozinha enquanto você caça e não zera com o Hunt Analyzer. Com 30 drops de um item, a quantidade medida passa a valer nas outras abas.</p>\n</div></div>\n    <h3>Botões e controles</h3>\n    <ul class=\"controls\"><li><b>Ler party e charms</b>: Abre rapidamente o painel de cada membro e a janela de Charms do jogo para ler level, bônus de loot, crítico e os charms que você tem. Use ao começar e sempre que trocar equipamento ou charms.</li><li><b>Dados</b>: Mostra o que é enviado se você ligar os dados de uso anônimos e permite ligar ou desliga
